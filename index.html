<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Dashboard — DEUNA</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Partner Dashboard">
  <meta name="theme-color" content="#FF5500">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      height:100%; background:#FF5500; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      display:flex; align-items:center; justify-content:center;
    }
    .wrap { text-align:center; color:#fff; padding:24px; }
    .wrap img { width:72px; height:72px; margin-bottom:20px; border-radius:16px; }
    .wrap a {
      display:inline-block; margin-top:22px; background:#fff; color:#FF5500;
      font-weight:700; font-size:16px; padding:14px 28px; border-radius:12px; text-decoration:none;
    }
    .wrap p { font-size:13px; opacity:.85; margin-top:14px; }
  </style>
  <script>
    // Só a PRIMEIRA visita fica parada aqui (necessário pra "Adicionar à Tela de
    // Início" capturar o apple-touch-icon certo). A partir da 2ª visita, já pula
    // direto pro dashboard sem exigir toque.
    var TARGET = "https://dev-portal.deuna.io/artifacts/view?name=Partnership-Dashboard&kind=folder";
    if (localStorage.getItem('dd_visited')) {
      location.replace(TARGET);
    } else {
      localStorage.setItem('dd_visited', '1');
    }
  </script>
</head>
<body>
  <div class="wrap">
    <img src="apple-touch-icon.png" alt="DEUNA">
    <div><a href="https://dev-portal.deuna.io/artifacts/view?name=Partnership-Dashboard&kind=folder">Abrir Dashboard</a></div>
    <p>Essa tela só aparece uma vez.<br>Da próxima vez o atalho já abre direto.</p>
  </div>
</body>
</html>
